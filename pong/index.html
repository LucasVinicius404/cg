<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pong WebGL</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        #jogo-container {
            position: relative;
            width: 1024px;
            height: 768px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #111;
            border: 2px solid #333;
        }
        #placar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="jogo-container">
        <div id="placar"><span id="pontosEsq">0</span> | <span id="pontosDir">0</span></div>
        <canvas id="canvas" width="1024" height="768"></canvas>
    </div>

    <script src="m3.js"></script>
    <script src="main.js"></script>
</body>
</html>
