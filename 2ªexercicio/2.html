<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2 - Reta e Triângulo (Bresenham)</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            padding-top: 20px;
        }
        canvas {
            border: 1px solid #555;
            background-color: #000;
            cursor: crosshair;
        }
        .painel {
            margin-top: 15px;
            text-align: center;
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }
        .status {
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>Reta e Triângulo (Bresenham)</h2>
    <canvas id="meuCanvas" width="800" height="600"></canvas>
    
    <div class="painel">
        <div class="status">Modo Atual: <span id="modoTexto">RETA</span></div>
        <p><strong>Teclas 'R' ou 'T':</strong> Alterna entre desenhar Reta ou Triângulo.</p>
        <p><strong>Mouse (Clique Esq.):</strong> 2 cliques para reta, 3 cliques para triângulo.</p>
        <p><strong>Teclado (0 a 9):</strong> Altera a cor da figura atual.</p>
    </div>

    <script>
        const canvas = document.getElementById('meuCanvas');
        const gl = canvas.getContext('webgl');
        if (!gl) throw new Error('WebGL não suportado.');

        const vertexShaderSource = `
            attribute vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
                gl_PointSize = 2.0; 
            }
        `;
        const fragmentShaderSource = `
            precision mediump float;
            uniform vec4 u_color;
            void main() {
                gl_FragColor = u_color;
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
            }
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, vertexShaderSource));
        gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const aPosition = gl.getAttribLocation(program, 'a_position');
        const uColor = gl.getUniformLocation(program, 'u_color');
        const buffer = gl.createBuffer();

        // ==========================================
        // 2. ESTADOS E VARIÁVEIS
        // ==========================================
        const paletaCores = [
            [1.0, 1.0, 1.0, 1.0], // 0: Branco
            [1.0, 0.0, 0.0, 1.0], // 1: Vermelho
            [0.0, 1.0, 0.0, 1.0], // 2: Verde
            [0.0, 0.0, 1.0, 1.0], // 3: Azul
            [1.0, 1.0, 0.0, 1.0], // 4: Amarelo
            [1.0, 0.0, 1.0, 1.0], // 5: Magenta
            [0.0, 1.0, 1.0, 1.0], // 6: Ciano
            [1.0, 0.5, 0.0, 1.0], // 7: Laranja
            [0.5, 0.0, 0.5, 1.0], // 8: Roxo
            [0.5, 0.5, 0.5, 1.0]  // 9: Cinza
        ];

        let corAtual = 3; // Azul
        let modoAtual = 'RETA'; // Pode ser 'RETA' ou 'TRIANGULO'
        let pontosColetados = []; // Guarda os cliques antes de desenhar
        
        // Guarda a última figura desenhada para podermos mudar a cor dela
        let figuraAtual = {
            tipo: 'RETA',
            pontos: [{x: 0, y: 0}, {x: 0, y: 0}]
        };

        
        // Calcula os pixels de uma linha usando Bresenham e retorna um array [x, y, x, y...]
        function gerarVerticesBresenham(p1, p2) {
            const vertices = [];
            let x0 = p1.x, y0 = p1.y;
            let x1 = p2.x, y1 = p2.y;
            
            let dx = Math.abs(x1 - x0);
            let dy = Math.abs(y1 - y0);
            let sx = (x0 < x1) ? 1 : -1;
            let sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                // Converte de Pixel (Canvas) para WebGL Clip Space (-1 a 1)
                let clipX = (x0 / canvas.width) * 2 - 1;
                let clipY = (y0 / canvas.height) * -2 + 1;
                vertices.push(clipX, clipY);

                if (x0 === x1 && y0 === y1) break;
                
                let e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx)  { err += dx; y0 += sy; }
            }
            return vertices;
        }

        // Função responsável por enviar os vértices finais para a GPU
        function renderizarNaTela(vertices) {
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform4fv(uColor, paletaCores[corAtual]);

            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

            gl.enableVertexAttribArray(aPosition);
            gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

            gl.drawArrays(gl.POINTS, 0, vertices.length / 2);
        }

        

        function imprimirLinha(p1, p2) {
            const vertices = gerarVerticesBresenham(p1, p2);
            renderizarNaTela(vertices);
        }

        function imprimirTriangulo(p1, p2, p3) {
            // Um triângulo é composto por 3 linhas usando Bresenham
            const linha1 = gerarVerticesBresenham(p1, p2);
            const linha2 = gerarVerticesBresenham(p2, p3);
            const linha3 = gerarVerticesBresenham(p3, p1);
            
            // Junta todos os vértices gerados em um único array
            const verticesTotais = [...linha1, ...linha2, ...linha3];
            renderizarNaTela(verticesTotais);
        }

        function alterarCor(indice) {
            if (indice >= 0 && indice <= 9) {
                corAtual = indice;
                // Redesenha a figura que está na tela no momento
                if (figuraAtual.tipo === 'RETA') {
                    imprimirLinha(figuraAtual.pontos[0], figuraAtual.pontos[1]);
                } else if (figuraAtual.tipo === 'TRIANGULO') {
                    imprimirTriangulo(figuraAtual.pontos[0], figuraAtual.pontos[1], figuraAtual.pontos[2]);
                }
            }
        }


        // Captura o clique do mouse
        canvas.addEventListener('mousedown', (event) => {
            if (event.button !== 0) return; // Apenas botão esquerdo

            const rect = canvas.getBoundingClientRect();
            const x = Math.round(event.clientX - rect.left);
            const y = Math.round(event.clientY - rect.top);

            pontosColetados.push({ x, y });

            if (modoAtual === 'RETA' && pontosColetados.length === 2) {
                figuraAtual = { tipo: 'RETA', pontos: [...pontosColetados] };
                imprimirLinha(pontosColetados[0], pontosColetados[1]);
                pontosColetados = []; // Reseta para a próxima figura
            } 
            else if (modoAtual === 'TRIANGULO' && pontosColetados.length === 3) {
                figuraAtual = { tipo: 'TRIANGULO', pontos: [...pontosColetados] };
                imprimirTriangulo(pontosColetados[0], pontosColetados[1], pontosColetados[2]);
                pontosColetados = []; // Reseta para a próxima figura
            }
        });

        // Captura o teclado para troca de modo e de cores
        window.addEventListener('keydown', (event) => {
            const tecla = event.key;

            if (tecla === 'r' || tecla === 'R') {
                modoAtual = 'RETA';
                pontosColetados = []; // Aborta figura em andamento
                document.getElementById('modoTexto').innerText = 'RETA';
            } 
            else if (tecla === 't' || tecla === 'T') {
                modoAtual = 'TRIANGULO';
                pontosColetados = []; // Aborta figura em andamento
                document.getElementById('modoTexto').innerText = 'TRIÂNGULO';
            } 
            else {
                // Tenta mudar a cor
                const numeroDigitado = parseInt(tecla);
                if (!isNaN(numeroDigitado)) {
                    alterarCor(numeroDigitado);
                }
            }
        }); 

        imprimirLinha(figuraAtual.pontos[0], figuraAtual.pontos[1]);

    </script>
</body>
</html>
